<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 이벤트</title>
    <link rel="stylesheet" href="css/study_15.css"> 
</head>
<body>
    <h3><a href="index.html">Home</a></h3>
    <ul>
        <li><a href="#" onclick="changeBg('kor')">한식</a></li>
        <li><a href="#" onclick="changeBg('chi')">중식</a></li>
        <li><a href="#" onclick="changeBg('jap')">일식</a></li>
    </ul>       

    <div id="container">
        <div id="result">이미지가 여기에 표시됩니다</div>
        <div id="description">음식 설명이 여기에 표시됩니다</div>
    </div>

    <div id="input-container">
        <input type="text" id="menu-input" placeholder="먹고 싶은 메뉴를 입력하세요">
        <button onclick="addMenu()">메뉴 등록</button>
        <button onclick="deleteMenu()">메뉴 삭제</button>
        <ul id="menu-list"></ul>
    </div>

    <button onclick="randomMenu()">랜덤 메뉴 선택</button>
    <div id="random-result">랜덤 메뉴 결과가 여기에 표시됩니다</div>

    <script src="javascript/study_15.js"></script>
